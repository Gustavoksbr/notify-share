spring:
  application:
    name: notify-share-backend

  # Carrega backend/.env (formato KEY=VALUE, igual a .properties) se existir.
  # E onde ficam SPRING_DATASOURCE_URL, GOOGLE_CLIENT_ID, JWT_SECRET, etc.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Padrao = Postgres local de desenvolvimento. Producao entra pelo profile
    # "prod" (application-prod.yml, usa DATABASE_URL). O script de E2E injeta
    # SPRING_DATASOURCE_URL, que tem precedencia sobre este valor.
    url: ${DATABASE_URL_DEV:jdbc:postgresql://localhost:5432/notifyshare?user=postgres&password=root}
    hikari:
      maximum-pool-size: 10
      pool-name: notifyshare-pool

  jpa:
    hibernate:
      # O schema e propriedade do Flyway. Hibernate so confere se bate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Se o schema ja tiver tabelas mas nenhum historico (ex.: banco Supabase
    # criado por outra via), cria a baseline em vez de falhar.
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Atras do proxy da Render: sem isto, toda requisicao chega com o IP
  # interno do proxy, e o rate limit por IP (RateLimitFilter) vira inutil —
  # todo mundo cai no mesmo balde. "framework" usa o ForwardedHeaderFilter do
  # Spring, que reescreve remoteAddr a partir de X-Forwarded-For.
  forward-headers-strategy: framework

notifyshare:
  rate-limit:
    # Janela por IP para as rotas de recuperacao de senha.
    password-reset-window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:PT15M}
    # Janela por IP para tentativas de login.
    login-window: ${LOGIN_RATE_LIMIT_WINDOW:PT1M}

  jwt:
    # Trocar em qualquer ambiente que nao seja a sua maquina. Minimo 32 bytes para HS256.
    secret: ${JWT_SECRET:dev-somente-local-troque-este-segredo-de-32-bytes-ou-mais}
    issuer: notify-share
    access-ttl: PT15M
    refresh-ttl: P90D
    refresh-reuse-grace: PT60S

  auth:
    # Bloqueio temporario de login por senha errada, por identificador
    # (nickname/e-mail digitado). Curto por padrao de proposito — e so
    # ajustar aqui se sentir necessidade depois.
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:11}
    login-lockout-duration: ${LOGIN_LOCKOUT_DURATION:PT1M}

    password-reset:
      # Codigos errados (contados por IP, nao por e-mail — assim ninguem trava
      # a recuperacao de outra pessoa) ate o bloqueio temporario, e a duracao.
      max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
      lockout-duration: ${PASSWORD_RESET_LOCKOUT_DURATION:PT5M}
      # Validade do codigo no e-mail e intervalo minimo entre dois envios pro
      # mesmo endereco (anti-flood de caixa de entrada).
      code-ttl: ${PASSWORD_RESET_CODE_TTL:PT20M}
      send-cooldown: ${PASSWORD_RESET_SEND_COOLDOWN:PT60S}
      # Espelha o teto de POST /auth/forgot-password do RateLimitFilter, so para
      # a tela conseguir explicar o limite. Mantenha igual ao filtro.
      max-requests-per-window: ${PASSWORD_RESET_MAX_REQUESTS:4}

  resend:
    # Envio de e-mail transacional (https://resend.com). Vazio = desligado: o
    # codigo de recuperacao vai pro log em vez de ser enviado (util em dev).
    api-key: ${RESEND_API_KEY:}
    # Remetente verificado no Resend, ex.: "Notify Share <nao-responda@seu-dominio.com>".
    from: ${RESEND_EMAIL_FROM:}

  google:
    # Client ID "Web application" do Google Cloud. Vazio = login com Google off.
    # E o audience (aud) esperado no ID token do Credential Manager.
    client-id: ${GOOGLE_CLIENT_ID:}
    # Client ID tipo "Android" — audience do ID token quando o login cai no
    # fallback pelo navegador (GoogleWebAuth), porque só o client Android aceita
    # redirect com esquema customizado (com.notifyshare:/...); o Web client recusa.
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}

  fcm:
    # Com enabled=false, ou sem credencial valida, o envio de push vira no-op e
    # loga em vez de falhar — util em teste e no primeiro boot.
    enabled: ${FCM_ENABLED:true}
    # Caminho do JSON da conta de servico. Em producao prefira FCM_CREDENTIALS
    # com o conteudo do arquivo, para nao precisar de arquivo no disco.
    credentials-path: ${FCM_CREDENTIALS_PATH:firebase-service-account.json}
    credentials-json: ${FCM_CREDENTIALS:}

  events:
    # Historico apagado depois deste tempo. O usuario pode encurtar no app.
    default-retention: ${EVENT_RETENTION:P7D}

  self-ping:
    # URL publica desta API (ex.: https://notify-share-backend.onrender.com).
    # Vazio = desligado (dev/local). Setado = pinga /ping a cada 10 min para o
    # Render nao hibernar e o Supabase nao pausar por inatividade.
    url: ${API_PRODUCTION_URL:}

springdoc:
  # Desligue em producao: SWAGGER_ENABLED=false remove a UI e o /v3/api-docs.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    # Nao apaga o token ao recarregar a pagina: evita reautorizar a cada teste.
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.notifyshare: DEBUG
    org.flywaydb: INFO
