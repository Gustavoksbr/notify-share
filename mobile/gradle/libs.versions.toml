# NOTA: estas versoes estao propositalmente uma geracao atras.
# A linha seguinte (Compose 1.12, core-ktx 1.19, lifecycle 2.11, navigation 2.10,
# okhttp 5.5) exige compileSdk 37, e so temos o SDK 36 instalado.
# Para subir: instale o Android API 37 pelo SDK Manager do Android Studio,
# mude compileSdk para 37 no app/build.gradle.kts e suba os numeros abaixo.
[versions]
# AGP 9.1.0: e o teto que o Android Studio estavel aceita hoje (o 9.3.2 so abre
# em canary). Nada no app precisa do 9.3; baixar nao muda uma linha de codigo.
agp = "9.1.0"
# Casa com o Kotlin que o AGP embute (kotlin-gradle-plugin 2.2.x no pom dele).
# O plugin do Compose precisa bater exatamente com a versao do Kotlin em uso.
kotlin = "2.2.10"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
navigationCompose = "2.9.8"
datastore = "1.2.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
work = "2.10.1"
googleServices = "4.4.2"
firebaseBom = "33.7.0"
credentials = "1.5.0"
googleId = "1.1.1"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# ProcessLifecycleOwner: saber quando o app inteiro esta em primeiro plano.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Traz collectAsStateWithLifecycle: coletar Flow parando junto com a tela.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Task.await(): transforma os Task<T> do Firebase/Play em suspend.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Login com Google via Credential Manager (o caminho atual; GoogleSignInClient foi descontinuado).
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-identity-googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# Conversor de primeira parte: o Retrofit 3 passou a publicar o proprio,
# entao nao e mais preciso o de terceiro (com.jakewharton.retrofit).
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# O plugin org.jetbrains.kotlin.android NAO entra aqui: desde o AGP 9.0 o
# suporte a Kotlin e embutido, e aplicar o plugin antigo faz o build falhar.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
