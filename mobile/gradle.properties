# Reduz o heap do Gradle para evitar OOM no daemon em máquinas com memória
# limitada. O build de release do Android precisa de menos concorrência.
org.gradle.jvmargs=-Xmx1024m -Xms256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
